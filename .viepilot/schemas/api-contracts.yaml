openapi: 3.1.0
info:
  title: CapCap Optional Remote Compatibility API
  version: 1.0.0
  description: >-
    Documentation of the existing optional local/remote worker compatibility surface.
    The 21-day core pipeline calls Python workflow/engine protocols directly. Remote
    worker expansion is deferred; Offline Lock disables this surface.
servers:
  - url: http://127.0.0.1:8765
    description: Local bind only by default
security:
  - CapCapToken: []
paths:
  /v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Service readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/status:
    get:
      operationId: status
      responses:
        '200':
          description: Current worker stage/status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/transcribe:
    post:
      operationId: transcribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeRequest'
      responses:
        '200':
          description: Timed source segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsResponse'
  /v1/translate-segments:
    post:
      operationId: translateSegments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateRequest'
      responses:
        '200':
          description: Translated segments preserving IDs/order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsResponse'
  /v1/rewrite-segments:
    post:
      operationId: rewriteDubbingSegments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
      responses:
        '200':
          description: Dubbing rewrite segments preserving IDs/order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsResponse'
  /v1/tts/synthesize:
    post:
      operationId: synthesizeCue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: Base64 WAV; callers must validate non-silence and media facts
          content:
            application/json:
              schema:
                type: object
                required: [ok, audio_b64]
                properties:
                  ok: {type: boolean, const: true}
                  audio_b64: {type: string, contentEncoding: base64}
  /v1/prepare:
    post:
      operationId: prepareProject
      x-milestone-status: compatibility-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Project state path and status}
  /v1/voice:
    post:
      operationId: generateVoiceTrack
      x-milestone-status: compatibility-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Voice workflow result}
  /v1/export:
    post:
      operationId: exportProject
      x-milestone-status: compatibility-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Export workflow result}
components:
  securitySchemes:
    CapCapToken:
      type: apiKey
      in: header
      name: X-CapCap-Token
      description: Required when the server has a configured token.
  schemas:
    Segment:
      type: object
      required: [id, start, end, original_text]
      properties:
        id: {type: string, minLength: 1}
        start: {type: number, minimum: 0}
        end: {type: number, exclusiveMinimum: 0}
        source_language: {type: string, enum: [zh, en]}
        original_text: {type: string}
        subtitle_vi: {type: string}
        dubbing_vi: {type: string}
        speaker_id: {type: [string, 'null']}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        qa_flags: {type: array, items: {type: string}}
        provenance: {type: object, additionalProperties: true}
    TranscribeRequest:
      type: object
      required: [audio_b64, language]
      properties:
        audio_b64: {type: string, contentEncoding: base64}
        audio_filename: {type: string}
        model_name: {type: string, default: base}
        language: {type: string, enum: [zh, en, auto]}
        task: {type: string, enum: [transcribe, translate], default: transcribe}
    TranslateRequest:
      type: object
      required: [segments, src_lang]
      properties:
        segments: {type: array, items: {$ref: '#/components/schemas/Segment'}}
        src_lang: {type: string, enum: [zh, en, auto]}
        target_lang: {type: string, const: vi}
        enable_polish: {type: boolean, default: true}
        optimize_subtitles: {type: boolean, default: false}
        style_instruction: {type: string}
    RewriteRequest:
      type: object
      required: [source_segments, translated_segments]
      properties:
        source_segments: {type: array, items: {$ref: '#/components/schemas/Segment'}}
        translated_segments: {type: array, items: {$ref: '#/components/schemas/Segment'}}
        src_lang: {type: string, enum: [zh, en, auto]}
        style_instruction: {type: string}
    TtsRequest:
      type: object
      required: [text, voice]
      properties:
        text: {type: string, minLength: 1}
        voice: {type: string}
        speed: {type: number, minimum: 0.5, maximum: 1.3, default: 1}
        normalizer_dictionary: {type: object, additionalProperties: {type: string}}
    SegmentsResponse:
      type: object
      required: [ok, segments]
      properties:
        ok: {type: boolean, const: true}
        segments: {type: array, items: {$ref: '#/components/schemas/Segment'}}
    StatusResponse:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        service: {type: string}
        stage: {type: string}
        message: {type: string}
